  <!-- 基础运行参数 -->
  <div class="crowkit-row">
    <div class="crowkit-field">
      <label>轮询间隔(秒，最低 2 秒)</label>
      <input type="number" id="cg-poll" min="2" max="60" step="0.5" value="3">
    </div>
    <div class="crowkit-field">
      <label>无头模式</label>
      <label class="crowkit-hint"><input type="checkbox" id="cg-headless" checked> 无头运行浏览器</label>
    </div>
  </div>
  <!-- 专业选择: 与教务系统"课程安排明细"一致的级联筛选 -->
  <div class="crowkit-row">
    <div class="crowkit-field">
      <label>培养层次</label>
      <select id="cg-level"><option value="">请选择</option></select>
    </div>
    <div class="crowkit-field">
      <label>年级</label>
      <select id="cg-grade" disabled><option value="">请选择</option></select>
    </div>
    <div class="crowkit-field">
      <label>院(系)/部</label>
      <select id="cg-dept" disabled><option value="">请选择</option></select>
    </div>
    <div class="crowkit-field">
      <label>专业</label>
      <select id="cg-major" disabled><option value="">请选择</option></select>
    </div>
  </div>
  <div class="crowkit-row cg-load-action-row">
    <button class="crowkit-btn crowkit-primary" id="cg-load" disabled>开始专业课程抓取</button>
    <span class="crowkit-hint cg-load-guidance" id="cg-load-guidance" hidden>
      选择好课程或班级后，按右上角运行来监控课程剩余名额并自动选课。存在时间冲突时按当前顺序优先尝试，成功选课后自动跳过无法兼容的冲突课程。
    </span>
  </div>

  <!-- 课程抓取进度条: 与专业目录抓取一致的宿主统一风格组件 -->
  <div class="crowkit-row" id="cg-courses-progress" hidden>
    <div class="crowkit-progress"><div class="crowkit-progress-bar" id="cg-courses-bar"></div></div>
    <span class="crowkit-hint" id="cg-courses-progress-text"></span>
  </div>

  <section class="cg-selected-panel" id="cg-selected-wrap" hidden>
    <div class="cg-selected-head">
      <strong>已选课程</strong>
      <span class="crowkit-hint" id="cg-selected-count"></span>
      <span class="crowkit-hint cg-selected-order-hint">拖拽调整轮询顺序</span>
    </div>
    <div class="cg-selected-list" id="cg-selected-list"></div>
  </section>

  <!-- 课程列表(本地缓存): 勾选即加入抢课列表 -->
  <div id="cg-courses-wrap" hidden>
    <div class="crowkit-row">
      <span class="crowkit-hint" id="cg-courses-meta"></span>
      <input type="text" id="cg-filter" placeholder="搜索课程名或教师">
      <select id="cg-category-filter" aria-label="按课程类别筛选">
        <option value="">全部课程类别</option>
      </select>
      <button class="crowkit-btn" id="cg-time-toggle" type="button">按时间筛选</button>
      <button class="crowkit-btn" id="cg-filter-reset" type="button">清除筛选</button>
    </div>
    <div class="cg-time-panel" id="cg-time-panel" hidden>
      <div class="crowkit-hint">可多选上课时段；班级包含任一所选时段即显示。</div>
      <div class="cg-time-grid-wrap" id="cg-time-grid"></div>
    </div>
    <div class="cg-course-list" id="cg-course-list"></div>
    <div class="cg-pagination" id="cg-pagination" hidden>
      <div class="cg-page-controls">
        <button class="crowkit-btn" id="cg-page-first" type="button">首页</button>
        <button class="crowkit-btn" id="cg-page-prev" type="button">上一页</button>
        <span class="crowkit-hint" id="cg-page-info"></span>
        <button class="crowkit-btn" id="cg-page-next" type="button">下一页</button>
      </div>
      <span class="crowkit-hint cg-page-summary" id="cg-page-summary"></span>
    </div>
  </div>
  <div class="crowkit-alert" id="cg-courses-empty" hidden></div>

</div>

<script>
(function () {
  "use strict";
  var Z = window.BnuToolBoxConfigUI;
  if (!Z) return;

  var $ = function (id) { return document.getElementById(id); };
  // 已选课程按“课程代码 + 班级”逐项保存, 数组顺序即轮询顺序
  var selectedOrder = [];
  var draggedSelectedIndex = null;
  var selectedSaveTimer = null;
  // 当前展示的课程缓存(点「确定」后填充)
  var cache = null;
  // 插件内置的专业目录
  var catalog = null;
  // 已保存的专业 {level:{v,t},...}
  var savedSp = null;
  // 课程抓取任务运行期间禁用按钮; 未运行时由点击处理器校验选择完整性
  var coursesRunning = false;

  function fillSelect(sel, items, keepValue) {
    var old = keepValue ? sel.value : "";
    sel.innerHTML = "";
    var ph = document.createElement("option");
    ph.value = "";
    ph.textContent = "请选择";
    sel.appendChild(ph);
    (items || []).forEach(function (it) {
      var o = document.createElement("option");
      o.value = it.v;
      o.textContent = it.t;
      sel.appendChild(o);
    });
    if (old) sel.value = old;
    sel.disabled = !(items && items.length);
  }

  function nodeAt(path) {
    // path: ["level","grade","dept"] 各级 value, 逐层下钻目录树,
    // 返回路径最深处节点的下一级选项数组(层级节点分别持有 grades/depts/majors)
    var cur = catalog ? catalog.levels : null;
    for (var i = 0; i < path.length; i++) {
      if (!cur) return null;
      var hit = null;
      for (var j = 0; j < cur.length; j++) {
        if (cur[j].v === path[i]) { hit = cur[j]; break; }
      }
      if (!hit) return null;
      cur = hit.grades || hit.depts || hit.majors || null;
    }
    return cur;
  }

  function rebuildCascade(selected) {
    // selected: 可选的预选值 {level,grade,dept,major}, 用于回显已保存专业
    var lv = $("cg-level"), gr = $("cg-grade"), dp = $("cg-dept"), mj = $("cg-major");
    fillSelect(lv, catalog ? catalog.levels : null);
    lv.value = (selected && selected.level) || "";
    fillSelect(gr, nodeAt([lv.value]), !!lv.value);
    gr.value = (selected && selected.grade) || "";
    fillSelect(dp, nodeAt([lv.value, gr.value]), !!gr.value);
    dp.value = (selected && selected.dept) || "";
    fillSelect(mj, nodeAt([lv.value, gr.value, dp.value]), !!dp.value);
    mj.value = (selected && selected.major) || "";
    syncLoadBtn();
  }

  async function applySelectedAccountSpecialty() {
    if (!catalog || typeof Z.getSelectedAccount !== "function") return false;
    let account;
    try {
      account = await Z.getSelectedAccount();
    } catch (e) {
      return false;
    }
    if (!account || !(account.education_level && account.grade
        && account.department && account.major)) {
      return false;
    }
    var grades = nodeAt([account.education_level]) || [];
    var departments = nodeAt([account.education_level, account.grade]) || [];
    var majors = nodeAt([
      account.education_level, account.grade, account.department,
    ]) || [];
    if (!grades.some(function (item) { return item.v === account.grade; })
        || !departments.some(function (item) {
          return item.v === account.department;
        })
        || !majors.some(function (item) { return item.v === account.major; })) {
      return false;
    }
    rebuildCascade({
      level: account.education_level,
      grade: account.grade,
      dept: account.department,
      major: account.major,
    });
    await save(true);
    await loadCourses();
    return true;
  }

  function syncLoadBtn() {
    // 选择完整性由点击时统一校验。这里只反映任务运行态, 避免某次 change
    // 事件缺失或界面重挂载后按钮永久停留在 disabled。
    var btn = $("cg-load");
    if (!btn) return;
    var hasCourses = !!(cache && Object.keys(cache.courses || {}).length);
    btn.disabled = coursesRunning;
    btn.textContent = hasCourses ? "更新课程列表" : "开始专业课程抓取";
    btn.classList.toggle("cg-refresh-btn", hasCourses);
    var guidance = $("cg-load-guidance");
    if (guidance) guidance.hidden = !hasCourses;
  }

  function specialtyNow() {
    function pair(sel) {
      var o = sel.selectedOptions[0];
      return { v: sel.value, t: o && o.value ? o.textContent : "" };
    }
    return {
      level: pair($("cg-level")), grade: pair($("cg-grade")),
      dept: pair($("cg-dept")), major: pair($("cg-major")),
    };
  }

  var DAY_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  var DAY_VALUES = { "一": 0, "二": 1, "三": 2, "四": 3, "五": 4, "六": 5, "日": 6, "天": 6 };
  var expandedCourses = {};
  var selectedTimes = {};
  var COURSE_PAGE_SIZE = 10;
  var coursePage = 1;

  function cleanCategory(value) {
    return String(value || "").trim()
      .replace(/\s*[\/／]\s*(?:必修|选修)\s*$/, "")
      .replace(/(?:必修|选修)\s*$/, "").trim();
  }

  function cleanCourseName(value) {
    return String(value || "").replace(/^\s*\[[^\]]+\]\s*/, "").trim();
  }

  function compactSchedule(row) {
    if (Array.isArray(row)) {
      return [row[0] || "", row[1] || "", row[2] || ""];
    }
    row = row || {};
    return [
      row.teacher || "",
      [row.weeks || "", row.time || ""].filter(Boolean).join(" "),
      row.location || ""
    ];
  }

  function normalizeCourseCache(data) {
    if (!data) return data;
    if (data.courses && !Array.isArray(data.courses)) return data;
    var grouped = {};
    (data.courses || []).forEach(function (rec) {
      var code = String(rec.code || "").trim().toUpperCase();
      if (!code) return;
      var cells = rec.cells || [];
      if (!grouped[code]) {
        grouped[code] = [
          cleanCourseName(cells[1] || code),
          String(cells[2] || "").trim(),
          cleanCategory(cells[4]),
          []
        ];
      }
      var classNum = String(cells[6] || "").trim();
      var classRow = grouped[code][3].find(function (item) {
        return item[0] === classNum;
      });
      if (!classRow) {
        classRow = [
          classNum,
          [String(cells[9] || "").trim(), String(cells[7] || "").trim()].join("/"),
          []
        ];
        grouped[code][3].push(classRow);
      }
      var schedules = Array.isArray(rec.schedule) ? rec.schedule : [];
      schedules.forEach(function (row) {
        var compact = compactSchedule(row);
        if (compact.some(Boolean)) classRow[2].push(compact);
      });
      (rec.extra || []).forEach(function (extra) {
        if (!Array.isArray(extra) || !extra.length) return;
        var compact = compactSchedule(extra);
        if (extra[0] && !extra.slice(1).some(Boolean)) {
          compact = ["", "", String(extra[0] || "").trim()];
        }
        if (compact.some(Boolean)) classRow[2].push(compact);
      });
    });
    return Object.assign({}, data, { courses: grouped });
  }

  function courseCodes() {
    return Object.keys((cache && cache.courses) || {}).sort(function (a, b) {
      return String(cache.courses[a][0]).localeCompare(
        String(cache.courses[b][0]), "zh-CN");
    });
  }

  function totalClassCount() {
    return Object.keys((cache && cache.courses) || {}).reduce(
      function (total, code) {
        return total + ((cache.courses[code][3] || []).length);
      }, 0);
  }

  function classKeyOf(classRow) {
    return String((classRow && classRow[0]) || "");
  }

  function selectionKey(code, classNum) {
    return String(code || "") + "\u0000" + String(classNum || "");
  }

  function selectionIndex(code, classNum) {
    var key = selectionKey(code, classNum);
    for (var i = 0; i < selectedOrder.length; i += 1) {
      if (selectionKey(
        selectedOrder[i].code, selectedOrder[i].classNum
      ) === key) return i;
    }
    return -1;
  }

  function selectionOf(code) {
    var values = selectedOrder.filter(function (item) {
      return item.code === code && item.classNum;
    }).map(function (item) {
      return item.classNum;
    });
    return values.length ? values : null;
  }

  function addSelected(code, classNum, grouped) {
    if (!code || selectionIndex(code, classNum) >= 0) return;
    selectedOrder.push({
      code: code,
      classNum: String(classNum || ""),
      grouped: !!grouped,
    });
  }

  function removeSelected(code, classNum) {
    selectedOrder = selectedOrder.filter(function (item) {
      return !(item.code === code && item.classNum === classNum);
    });
  }

  function scheduleSelectedSave() {
    if (selectedSaveTimer) clearTimeout(selectedSaveTimer);
    selectedSaveTimer = setTimeout(function () {
      selectedSaveTimer = null;
      save(true);
    }, 200);
  }

  function selectionChanged() {
    renderSelectedCourses();
    renderCourses();
    scheduleSelectedSave();
  }

  function toggleWholeCourse(code, classNums) {
    var selected = selectionOf(code);
    var course = cache && cache.courses && cache.courses[code];
    var allClassNums = course
      ? (course[3] || []).map(classKeyOf).filter(Boolean)
      : classNums.slice();
    var allSelected = selected !== null && allClassNums.length > 0
      && allClassNums.every(function (classNum) {
        return selected.indexOf(classNum) >= 0;
      });
    selectedOrder = selectedOrder.filter(function (item) {
      return item.code !== code;
    });
    if (!allSelected) {
      allClassNums.forEach(function (classNum) {
        addSelected(code, classNum, true);
      });
    }
    selectionChanged();
  }

  function toggleClass(code, classNum) {
    if (selectionIndex(code, classNum) >= 0) removeSelected(code, classNum);
    else addSelected(code, classNum, false);
    selectedOrder.forEach(function (item) {
      if (item.code === code) item.grouped = false;
    });
    selectionChanged();
  }

  function scheduleWeeks(text) {
    var dayMatch = String(text || "").search(/周[一二三四五六日天]/);
    var weekText = dayMatch >= 0
      ? String(text || "").slice(0, dayMatch) : String(text || "");
    var weeks = {};
    var match;
    var parityHint = (weekText.match(/[单双]/) || [""])[0];
    var re = /(\d+)(?:\s*-\s*(\d+))?\s*([单双])?/g;
    while ((match = re.exec(weekText))) {
      var start = Number(match[1]);
      var end = Number(match[2] || match[1]);
      var parity = match[3] || parityHint;
      for (var week = start; week <= end && week <= 30; week += 1) {
        if (parity === "单" && week % 2 === 0) continue;
        if (parity === "双" && week % 2 === 1) continue;
        weeks[week] = true;
      }
    }
    if (!Object.keys(weeks).length) {
      for (var fallback = 1; fallback <= 30; fallback += 1) {
        weeks[fallback] = true;
      }
    }
    return weeks;
  }

  function scheduleSegments(classRow) {
    var segments = [];
    (classRow[2] || []).forEach(function (row) {
      var text = String(compactSchedule(row)[1] || "");
      var weeks = scheduleWeeks(text);
      var match;
      var re = /周([一二三四五六日天])([^周]*?)(\d+)(?:\s*-\s*(\d+))?\s*节/g;
      while ((match = re.exec(text))) {
        var day = DAY_VALUES[match[1]];
        var start = Number(match[3]);
        var end = Number(match[4] || match[3]);
        for (var period = start; period <= end; period += 1) {
          if (period >= 1 && period <= 12) {
            segments.push({ weeks: weeks, day: day, period: period });
          }
        }
      }
    });
    return segments;
  }

  function schedulesOverlap(left, right) {
    return left.some(function (a) {
      return right.some(function (b) {
        if (a.day !== b.day || a.period !== b.period) return false;
        return Object.keys(a.weeks).some(function (week) {
          return !!b.weeks[week];
        });
      });
    });
  }

  function uniqueValues(values) {
    var seen = {};
    return values.filter(function (value) {
      value = String(value || "").replace(/\s+/g, " ").trim();
      if (!value || seen[value]) return false;
      seen[value] = true;
      return true;
    });
  }

  function teacherNames(values) {
    return values.reduce(function (all, value) {
      return all.concat(String(value || "").split(/[\s、,，/／]+/));
    }, []);
  }

  function summaryOfThree(values, separator) {
    var unique = uniqueValues(values);
    if (!unique.length) return "";
    return unique.slice(0, 3).join(separator)
      + (unique.length > 3 ? " 等" : "");
  }

  function classInfoForSelection(code, classNum) {
    var course = (cache && cache.courses && cache.courses[code]) || null;
    var classRow = null;
    if (course) {
      classRow = (course[3] || []).find(function (row) {
        return classKeyOf(row) === classNum;
      }) || null;
    }
    return {
      course: course,
      classRow: classRow,
      segments: scheduleSegments(classRow || [null, null, []]),
    };
  }

  function selectedDisplayEntries() {
    var display = [];
    var byCode = {};
    selectedOrder.forEach(function (item) {
      if (!byCode[item.code]) byCode[item.code] = [];
      byCode[item.code].push(item);
    });
    var processed = {};
    selectedOrder.forEach(function (item) {
      if (processed[item.code]) return;
      processed[item.code] = true;
      var items = byCode[item.code];
      var course = cache && cache.courses && cache.courses[item.code];
      var allClassNums = course
        ? (course[3] || []).map(classKeyOf).filter(Boolean)
        : [];
      var selectedClassNums = items.map(function (selected) {
        return selected.classNum;
      });
      var allClassesSelected = allClassNums.length > 0
        && allClassNums.every(function (classNum) {
          return selectedClassNums.indexOf(classNum) >= 0;
        });
      var grouped = allClassNums.length
        ? allClassesSelected
        : items.every(function (selected) { return selected.grouped; });
      if (!grouped) {
        items.forEach(function (selected) {
          display.push({
            code: selected.code,
            classNums: [selected.classNum],
            items: [selected],
            grouped: false,
          });
        });
        return;
      }
      display.push({
        code: item.code,
        classNums: selectedClassNums,
        items: items,
        grouped: true,
      });
    });

    return display.map(function (entry) {
      var details = entry.classNums.map(function (classNum) {
        return classInfoForSelection(entry.code, classNum);
      });
      var course = details.find(function (detail) {
        return !!detail.course;
      });
      course = course && course.course;
      var schedules = details.reduce(function (all, detail) {
        return all.concat((detail.classRow && detail.classRow[2]) || []);
      }, []);
      return {
        code: entry.code,
        classNums: entry.classNums,
        items: entry.items,
        grouped: entry.grouped,
        name: (course && course[0]) || entry.code,
        category: cleanCategory(course && course[2]) || "类别未注明",
        teacher: summaryOfThree(teacherNames(schedules.map(function (row) {
          return compactSchedule(row)[0];
        })), "、") || "教师未注明",
        time: summaryOfThree(schedules.map(function (row) {
          return compactSchedule(row)[1];
        }), "；") || "时间未注明",
        alternatives: details.map(function (detail, index) {
          return {
            classNum: entry.classNums[index],
            segments: detail.segments,
          };
        }),
        key: entry.grouped
          ? selectionKey(entry.code, "*grouped*")
          : selectionKey(entry.code, entry.classNums[0]),
      };
    });
  }

  function conflictFreeAssignment(groups, index, chosen) {
    if (index >= groups.length) return true;
    var group = groups[index];
    return group.alternatives.some(function (alternative) {
      var compatible = chosen.every(function (selected) {
        return !schedulesOverlap(alternative.segments, selected.segments);
      });
      if (!compatible) return false;
      chosen.push(alternative);
      var found = conflictFreeAssignment(groups, index + 1, chosen);
      chosen.pop();
      return found;
    });
  }

  function selectionConflicts(entries) {
    var conflicts = {};
    entries.forEach(function (entry) {
      conflicts[entry.key] = [];
    });
    var byCode = {};
    var groups = [];
    selectedOrder.forEach(function (item) {
      if (!byCode[item.code]) {
        var info = classInfoForSelection(item.code, item.classNum);
        byCode[item.code] = {
          code: item.code,
          name: (info.course && info.course[0]) || item.code,
          alternatives: [],
        };
        groups.push(byCode[item.code]);
      }
      var selectedClass = classInfoForSelection(item.code, item.classNum);
      byCode[item.code].alternatives.push({
        classNum: item.classNum,
        segments: selectedClass.segments,
      });
    });
    if (groups.length <= 1
        || conflictFreeAssignment(groups, 0, [])) {
      return conflicts;
    }

    var conflictLabels = {};
    groups.forEach(function (group) {
      conflictLabels[group.code] = [];
    });
    var pairFound = false;
    for (var i = 0; i < groups.length; i += 1) {
      for (var j = i + 1; j < groups.length; j += 1) {
        var compatiblePair = groups[i].alternatives.some(function (left) {
          return groups[j].alternatives.some(function (right) {
            return !schedulesOverlap(left.segments, right.segments);
          });
        });
        if (compatiblePair) continue;
        pairFound = true;
        conflictLabels[groups[i].code].push(groups[j].name);
        conflictLabels[groups[j].code].push(groups[i].name);
      }
    }
    if (!pairFound) {
      groups.forEach(function (group) {
        conflictLabels[group.code] = groups.filter(function (other) {
          return other.code !== group.code;
        }).map(function (other) {
          return other.name;
        });
      });
    }
    entries.forEach(function (entry) {
      conflicts[entry.key] = uniqueValues(conflictLabels[entry.code] || []);
    });
    return conflicts;
  }

  function materializeSelectedOrder() {
    var next = [];
    var seen = {};
    selectedOrder.forEach(function (item) {
      var classNums = [item.classNum];
      if (!item.classNum && cache && cache.courses && cache.courses[item.code]) {
        classNums = ((cache.courses[item.code][3] || []).map(classKeyOf));
      }
      classNums.forEach(function (classNum) {
        var key = selectionKey(item.code, classNum);
        if (seen[key]) return;
        seen[key] = true;
        next.push({
          code: item.code,
          classNum: String(classNum || ""),
          grouped: !!item.grouped || !item.classNum,
        });
      });
    });
    selectedOrder = next;
  }

  function moveSelectedDisplay(entries, from, to) {
    if (from === null || from === to || from < 0 || to < 0
        || from >= entries.length || to >= entries.length) {
      return;
    }
    var ordered = entries.slice();
    var moved = ordered.splice(from, 1)[0];
    ordered.splice(to, 0, moved);
    selectedOrder = ordered.reduce(function (all, entry) {
      return all.concat(entry.items);
    }, []);
    renderSelectedCourses();
    scheduleSelectedSave();
  }

  function renderSelectedCourses() {
    var wrap = $("cg-selected-wrap");
    var list = $("cg-selected-list");
    if (!wrap || !list) return;
    list.innerHTML = "";
    var entries = selectedDisplayEntries();
    var conflicts = selectionConflicts(entries);
    var conflictCount = entries.filter(function (entry) {
      return conflicts[entry.key].length > 0;
    }).length;
    var hasCourseCache = !!(cache && Object.keys(cache.courses || {}).length);
    wrap.hidden = entries.length === 0 && !hasCourseCache;
    $("cg-selected-count").textContent = entries.length
      ? "共 " + entries.length + " 项"
        + (conflictCount ? " · " + conflictCount + " 项时间冲突" : "")
      : "";
    if (!entries.length) {
      var empty = document.createElement("div");
      empty.className = "cg-selected-empty";
      empty.textContent = "尚未选择课程，点击下方课程或班级即可添加。";
      list.appendChild(empty);
      return;
    }

    entries.forEach(function (entry, index) {
      var row = document.createElement("div");
      row.className = "cg-selected-row";
      row.draggable = true;
      row.dataset.index = String(index);
      row.classList.toggle("has-conflict", conflicts[entry.key].length > 0);
      row.setAttribute(
        "aria-label",
        "第 " + (index + 1) + " 项，" + entry.name
        + (conflicts[entry.key].length ? "，存在时间冲突" : "")
      );

      var handle = document.createElement("span");
      handle.className = "cg-drag-handle";
      handle.textContent = "⋮⋮";
      handle.title = "拖拽调整顺序";
      handle.tabIndex = 0;
      handle.setAttribute("role", "button");
      handle.setAttribute("aria-label", "拖拽调整第 " + (index + 1) + " 项顺序");
      row.appendChild(handle);

      var main = document.createElement("div");
      main.className = "cg-selected-main";
      var title = document.createElement("div");
      title.className = "cg-selected-title";
      var name = document.createElement("strong");
      name.textContent = entry.name;
      title.appendChild(name);
      var category = document.createElement("span");
      category.className = "cg-selected-category";
      category.textContent = entry.category;
      title.appendChild(category);
      if (entry.grouped && entry.classNums.length > 1) {
        var alternatives = document.createElement("span");
        alternatives.className = "cg-selected-alternatives";
        alternatives.textContent = entry.classNums.length + " 个班级任选";
        title.appendChild(alternatives);
      }
      if (conflicts[entry.key].length) {
        var warning = document.createElement("span");
        warning.className = "cg-conflict-badge";
        warning.textContent = "时间冲突";
        title.appendChild(warning);
      }
      main.appendChild(title);

      var facts = document.createElement("div");
      facts.className = "cg-selected-facts";
      [
        ["教师", entry.teacher],
        ["上课时间", entry.time]
      ].forEach(function (fact) {
        var value = document.createElement("span");
        value.dataset.label = fact[0];
        value.textContent = fact[1];
        facts.appendChild(value);
      });
      main.appendChild(facts);
      if (conflicts[entry.key].length) {
        var note = document.createElement("div");
        note.className = "cg-conflict-note";
        note.textContent = "与 " + conflicts[entry.key].join("、") + " 冲突";
        main.appendChild(note);
      }
      row.appendChild(main);

      var actions = document.createElement("div");
      actions.className = "cg-selected-actions";
      var remove = document.createElement("button");
      remove.type = "button";
      remove.className = "crowkit-btn cg-selected-remove";
      remove.textContent = entry.grouped ? "删除同课程全部班级" : "取消";
      remove.addEventListener("click", function (event) {
        event.stopPropagation();
        selectedOrder = selectedOrder.filter(function (item) {
          return entry.items.indexOf(item) < 0;
        });
        selectionChanged();
      });
      actions.appendChild(remove);
      var selectedForCourse = selectedOrder.filter(function (item) {
        return item.code === entry.code;
      }).length;
      if (!entry.grouped && selectedForCourse > 1) {
        var removeCourse = document.createElement("button");
        removeCourse.type = "button";
        removeCourse.className = "crowkit-btn cg-selected-remove cg-remove-course";
        removeCourse.textContent = "删除同课程全部班级";
        removeCourse.addEventListener("click", function (event) {
          event.stopPropagation();
          selectedOrder = selectedOrder.filter(function (item) {
            return item.code !== entry.code;
          });
          selectionChanged();
        });
        actions.appendChild(removeCourse);
      }
      row.appendChild(actions);

      handle.addEventListener("pointerdown", function (event) {
        if (event.button !== 0) return;
        event.preventDefault();
        draggedSelectedIndex = index;
        row.classList.add("is-dragging");
        function clearTargets() {
          list.querySelectorAll(".cg-selected-row").forEach(function (item) {
            item.classList.remove("is-drop-target");
          });
        }
        function targetRowAt(x, y) {
          var target = document.elementFromPoint(x, y);
          return target && target.closest
            ? target.closest(".cg-selected-row") : null;
        }
        function onMove(moveEvent) {
          clearTargets();
          var target = targetRowAt(moveEvent.clientX, moveEvent.clientY);
          if (target && target !== row) target.classList.add("is-drop-target");
        }
        function onUp(upEvent) {
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          var target = targetRowAt(upEvent.clientX, upEvent.clientY);
          var from = draggedSelectedIndex;
          draggedSelectedIndex = null;
          clearTargets();
          if (target && target !== row) {
            moveSelectedDisplay(entries, from, Number(target.dataset.index));
          } else {
            row.classList.remove("is-dragging");
          }
        }
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
      });
      handle.addEventListener("keydown", function (event) {
        if (!event.altKey) return;
        if (event.key === "ArrowUp" && index > 0) {
          event.preventDefault();
          moveSelectedDisplay(entries, index, index - 1);
        } else if (event.key === "ArrowDown" && index < entries.length - 1) {
          event.preventDefault();
          moveSelectedDisplay(entries, index, index + 1);
        }
      });
      row.addEventListener("dragstart", function (event) {
        draggedSelectedIndex = index;
        row.classList.add("is-dragging");
        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", String(index));
        }
      });
      row.addEventListener("dragover", function (event) {
        event.preventDefault();
        row.classList.add("is-drop-target");
        if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
      });
      row.addEventListener("dragleave", function () {
        row.classList.remove("is-drop-target");
      });
      row.addEventListener("drop", function (event) {
        event.preventDefault();
        row.classList.remove("is-drop-target");
        if (draggedSelectedIndex === null || draggedSelectedIndex === index) return;
        var from = draggedSelectedIndex;
        draggedSelectedIndex = null;
        moveSelectedDisplay(entries, from, index);
      });
      row.addEventListener("dragend", function () {
        draggedSelectedIndex = null;
        list.querySelectorAll(".cg-selected-row").forEach(function (item) {
          item.classList.remove("is-dragging", "is-drop-target");
        });
      });
      list.appendChild(row);
    });
  }

  function meetingSlots(schedule) {
    var text = String(compactSchedule(schedule)[1] || "");
    var dayMatch = text.match(/周([一二三四五六日天])/);
    if (!dayMatch) return [];
    var day = DAY_VALUES[dayMatch[1]];
    var slots = [], match;
    var re = /(\d+)(?:\s*-\s*(\d+))?\s*节/g;
    while ((match = re.exec(text))) {
      var start = Number(match[1]), end = Number(match[2] || match[1]);
      for (var period = start; period <= end; period += 1) {
        if (period >= 1 && period <= 12) slots.push(day + ":" + period);
      }
    }
    return slots;
  }

  function selectedTimeKeys() {
    return Object.keys(selectedTimes).filter(function (key) {
      return selectedTimes[key];
    });
  }

  function classMatches(classRow, keyword, timeKeys, courseMatchesKeyword) {
    if (timeKeys.length) {
      var slots = [];
      (classRow[2] || []).forEach(function (row) {
        slots = slots.concat(meetingSlots(row));
      });
      if (!timeKeys.some(function (key) { return slots.indexOf(key) >= 0; })) {
        return false;
      }
    }
    if (!keyword || courseMatchesKeyword) return true;
    return (classRow[2] || []).some(function (row) {
      return String(compactSchedule(row)[0] || "").toLowerCase().indexOf(keyword) >= 0;
    });
  }

  function availabilityText(classRow) {
    var parts = String(classRow[1] || "").split("/");
    var available = parts[0] || "—";
    var limit = parts[1] || "—";
    return "可选 " + available + " / 限选 " + limit;
  }

  function renderCourseCard(code, course, classes) {
    var card = document.createElement("section");
    card.className = "cg-course-card";
    var selected = selectionOf(code);
    var classNums = classes.map(classKeyOf);
    var allClassesSelected = selected !== null && (
      selected.length === 0
      || (classNums.length > 0 && classNums.every(function (classNum) {
        return selected.indexOf(classNum) >= 0;
      }))
    );
    var expanded = Object.prototype.hasOwnProperty.call(expandedCourses, code)
      ? !!expandedCourses[code]
      : selected !== null || classes.length <= 3;
    card.classList.toggle("is-selected", selected !== null);
    card.classList.toggle("is-single-class", classes.length === 1);

    if (classes.length === 1) {
      var singleClass = classes[0];
      card.setAttribute("role", "button");
      card.tabIndex = 0;
      var singleLayout = document.createElement("div");
      singleLayout.className = "cg-single-layout";
      var singleSummary = document.createElement("div");
      singleSummary.className = "cg-single-summary";
      var singleCheck = makeCheckbox(selected !== null, false);
      singleCheck.setAttribute("aria-label", "选择课程 " + course[0]);
      singleSummary.appendChild(singleCheck);
      singleSummary.appendChild(courseCopyElement(course, code));
      var singleAvailability = document.createElement("div");
      singleAvailability.className = "cg-single-availability";
      singleAvailability.textContent = availabilityText(singleClass);
      singleSummary.appendChild(singleAvailability);
      singleLayout.appendChild(singleSummary);
      singleLayout.appendChild(subcourseListElement(singleClass));
      card.appendChild(singleLayout);
      function chooseSingle() {
        toggleWholeCourse(code, classNums);
      }
      card.addEventListener("click", chooseSingle);
      card.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          chooseSingle();
        }
      });
      return card;
    }

    var head = document.createElement("div");
    head.className = "cg-course-head";
    head.setAttribute("role", "button");
    head.tabIndex = 0;
    var box = makeCheckbox(
      allClassesSelected,
      selected !== null && selected.length > 0 && !allClassesSelected);
    box.setAttribute("aria-label", "选择课程 " + course[0]);
    head.appendChild(box);
    head.appendChild(courseCopyElement(course, code));
    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "crowkit-btn cg-expand";
    toggle.textContent = expanded ? "收起班级" : "展开班级 (" + classes.length + ")";
    toggle.addEventListener("click", function (event) {
      event.stopPropagation();
      expandedCourses[code] = !expanded;
      renderCourses();
    });
    head.appendChild(toggle);
    function chooseWhole(event) {
      if (event && event.target === toggle) return;
      toggleWholeCourse(code, classNums);
    }
    head.addEventListener("click", chooseWhole);
    head.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        chooseWhole(event);
      }
    });
    card.appendChild(head);

    if (expanded) {
      var list = document.createElement("div");
      list.className = "cg-class-list";
      classes.forEach(function (classRow) {
        var classNum = classKeyOf(classRow);
        var classBox = document.createElement("div");
        classBox.className = "cg-class-block";
        classBox.setAttribute("role", "checkbox");
        classBox.tabIndex = 0;
        var classSelected = selected !== null && (
          selected.length === 0 || selected.indexOf(classNum) >= 0);
        classBox.classList.toggle("is-selected", classSelected);
        classBox.setAttribute(
          "aria-checked",
          classSelected ? "true" : "false");
        var classSummary = document.createElement("div");
        classSummary.className = "cg-class-summary";
        var classCheck = makeCheckbox(classSelected, false);
        classCheck.setAttribute("aria-label", "选择班级 " + (classNum || "未编号"));
        classSummary.appendChild(classCheck);
        var classHead = document.createElement("div");
        classHead.className = "cg-class-copy";
        var className = document.createElement("strong");
        className.textContent = "班级 " + (classNum || "未编号");
        classHead.appendChild(className);
        var availability = document.createElement("span");
        availability.className = "cg-class-availability";
        availability.textContent = availabilityText(classRow);
        classHead.appendChild(availability);
        classSummary.appendChild(classHead);
        classBox.appendChild(classSummary);
        classBox.appendChild(subcourseListElement(classRow));
        classBox.addEventListener("click", function (event) {
          event.stopPropagation();
          toggleClass(code, classNum);
        });
        classBox.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleClass(code, classNum);
          }
        });
        list.appendChild(classBox);
      });
      card.appendChild(list);
    }
    return card;
  }

  function populateCategoryFilter() {
    var select = $("cg-category-filter");
    var current = select.value;
    var categories = {};
    Object.keys((cache && cache.courses) || {}).forEach(function (code) {
      var category = cleanCategory(cache.courses[code][2]);
      if (category) categories[category] = true;
    });
    select.innerHTML = "";
    var all = document.createElement("option");
    all.value = "";
    all.textContent = "全部课程类别";
    select.appendChild(all);
    Object.keys(categories).sort(function (a, b) {
      return a.localeCompare(b, "zh-CN");
    }).forEach(function (category) {
      var option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      select.appendChild(option);
    });
    select.value = Object.prototype.hasOwnProperty.call(categories, current)
      ? current : "";
  }

  function renderTimeGrid() {
    var grid = $("cg-time-grid");
    grid.innerHTML = "";
    var table = document.createElement("table");
    table.className = "cg-time-table";
    var head = document.createElement("thead");
    var headRow = document.createElement("tr");
    var corner = document.createElement("th");
    corner.textContent = "节次";
    headRow.appendChild(corner);
    DAY_NAMES.forEach(function (name) {
      var th = document.createElement("th");
      th.textContent = name;
      headRow.appendChild(th);
    });
    head.appendChild(headRow);
    table.appendChild(head);
    var body = document.createElement("tbody");
    for (var period = 1; period <= 12; period += 1) {
      var row = document.createElement("tr");
      var label = document.createElement("th");
      label.textContent = "第 " + period + " 节";
      row.appendChild(label);
      for (var day = 0; day < 7; day += 1) {
        var td = document.createElement("td");
        var key = day + ":" + period;
        var button = document.createElement("button");
        button.type = "button";
        button.className = "cg-time-cell" + (selectedTimes[key] ? " is-selected" : "");
        button.textContent = String(period);
        button.setAttribute("aria-pressed", selectedTimes[key] ? "true" : "false");
        button.addEventListener("click", function (slot) {
          return function () {
            selectedTimes[slot] = !selectedTimes[slot];
            renderTimeGrid();
            renderCourses(true);
          };
        }(key));
        td.appendChild(button);
        row.appendChild(td);
      }
      body.appendChild(row);
    }
    table.appendChild(body);
    grid.appendChild(table);
  }

  function renderCourses(resetPage) {
    var list = $("cg-course-list");
    if (!list) return;
    list.innerHTML = "";
    if (!cache) return;
    if (resetPage) coursePage = 1;
    var keyword = ($("cg-filter").value || "").trim().toLowerCase();
    var category = $("cg-category-filter").value;
    var timeKeys = selectedTimeKeys();
    var entries = [];
    courseCodes().forEach(function (code) {
      var course = cache.courses[code] || [];
      var courseCategory = cleanCategory(course[2]);
      if (category && courseCategory !== category) return;
      var courseMatchesKeyword = !keyword
        || String(course[0] || "").toLowerCase().indexOf(keyword) >= 0
        || code.toLowerCase().indexOf(keyword) >= 0;
      var classes = (course[3] || []).filter(function (classRow) {
        return classMatches(classRow, keyword, timeKeys, courseMatchesKeyword);
      });
      if (!classes.length) return;
      entries.push({ code: code, course: course, classes: classes });
    });
    var totalPages = Math.max(1, Math.ceil(entries.length / COURSE_PAGE_SIZE));
    coursePage = Math.min(totalPages, Math.max(1, coursePage));
    var pageStart = (coursePage - 1) * COURSE_PAGE_SIZE;
    var pageEntries = entries.slice(pageStart, pageStart + COURSE_PAGE_SIZE);
    pageEntries.forEach(function (entry) {
      list.appendChild(renderCourseCard(
        entry.code, entry.course, entry.classes));
    });
    if (!entries.length) {
      var empty = document.createElement("div");
      empty.className = "crowkit-alert crowkit-warn";
      empty.textContent = "没有符合当前筛选条件的课程或班级。";
      list.appendChild(empty);
    }
    var total = courseCodes().length;
    var totalClasses = totalClassCount();
    var stale = Number(cache.schema_version || 0) < 3;
    var pageInfo = $("cg-page-info");
    pageInfo.textContent = "第 " + coursePage + " / " + totalPages + " 页";
    $("cg-page-first").disabled = coursePage <= 1;
    $("cg-page-prev").disabled = coursePage <= 1;
    $("cg-page-next").disabled = coursePage >= totalPages;
    $("cg-pagination").hidden = false;
    $("cg-courses-meta").textContent = total + " 门课程 · "
      + totalClasses + " 个班级";
    $("cg-page-summary").textContent = entries.length + " / " + total
      + " 门课程 · 本页 " + pageEntries.length + " 门 · 缓存更新于 "
      + (cache.updated_at || "-")
      + (stale ? " · 旧缓存，请重新抓取以补全班级和排课信息" : "");
  }

  async function fetchCourses() {
    // true=成功, false=未缓存/参数不全, null=请求期间选择已变化
    var requestId = ++courseCacheRequest;
    var sp = specialtyNow();
    if (!(sp.level.v && sp.grade.v && sp.dept.v && sp.major.v)) return false;
    try {
      var data = await Z.api("plugins/course-grab/major-courses?level="
        + encodeURIComponent(sp.level.v) + "&grade=" + encodeURIComponent(sp.grade.v)
        + "&dept=" + encodeURIComponent(sp.dept.v) + "&major=" + encodeURIComponent(sp.major.v));
      if (requestId !== courseCacheRequest) return null;
      cache = normalizeCourseCache(data);
      materializeSelectedOrder();
      $("cg-courses-wrap").hidden = false;
      $("cg-courses-empty").hidden = true;
      populateCategoryFilter();
      renderTimeGrid();
      coursePage = 1;
      renderSelectedCourses();
      renderCourses();
      syncLoadBtn();
      return true;
    } catch (e) {
      if (requestId !== courseCacheRequest) return null;
      cache = null;
      $("cg-courses-wrap").hidden = true;
      renderSelectedCourses();
      syncLoadBtn();
      return false;
    }
  }

  async function loadCourses() {
    // 用户可见的加载: 未缓存时提示点「开始专业课程抓取」
    if ((await fetchCourses()) === false) {
      var empty = $("cg-courses-empty");
      empty.hidden = false;
      empty.className = "crowkit-alert crowkit-warn";
      empty.textContent = "该专业课程列表尚未缓存。";
    }
  }

  function maybeAutoLoad() {
    // 选满四级后自动加载该专业的课程缓存(如有), 无需再点按钮
    if ($("cg-level").value && $("cg-grade").value
        && $("cg-dept").value && $("cg-major").value) {
      loadCourses();
    }
  }

  function collectConfig() {
    var courses = {};
    selectedOrder.forEach(function (item) {
      var code = String(item.code || "").trim().toUpperCase();
      if (!code) return;
      if (!courses[code]) courses[code] = [];
      var classNum = String(item.classNum || "").trim();
      if (classNum && courses[code].indexOf(classNum) < 0) {
        courses[code].push(classNum);
      }
    });
    return {
      poll_interval: Math.min(
        60, Math.max(2, Number($("cg-poll").value) || 3)),
      headless: $("cg-headless").checked,
      specialty: specialtyNow(),
      courses: courses,
      course_order: selectedOrder.map(function (item) {
        return {
          code: String(item.code || "").trim().toUpperCase(),
          class_num: String(item.classNum || "").trim(),
          grouped: !!item.grouped,
        };
      }).filter(function (item) {
        return !!item.code;
      }),
    };
  }

  async function save(silent) {
    try {
      await Z.saveConfig(collectConfig());
      if (!silent) Z.message("success", "配置已保存;启动插件后生效");
      return true;
    } catch (e) {
      Z.message("error", "保存失败: " + e.message);
      return false;
    }
  }

  async function loadCatalog(selected) {
    try {
      var encoded = $("cg-bundled-catalog").value.trim();
      if (!encoded) throw new Error("内置专业目录为空");
      if (typeof DecompressionStream !== "function") {
        throw new Error("当前浏览器不支持内置目录解压");
      }
      var binary = atob(encoded);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      var stream = new Blob([bytes]).stream().pipeThrough(
        new DecompressionStream("gzip"));
      catalog = JSON.parse(await new Response(stream).text());
      rebuildCascade(selected || null);
      return true;
    } catch (e) {
      catalog = null;
      rebuildCascade(null);
      Z.message("error", "专业目录加载失败: " + e.message);
      return false;
    }
  }

  async function progressFromEvents() {
    // 兜底: 旧版主程序的 /api/plugins 不带 progress 字段(插件子进程每次任务
    // 都从磁盘重新加载新代码, 宿主进程不会), 改从插件事件日志解析进度。
    // 定位到本次进程启动标记(plugin_status running)之后, 避免读到上一次运行的旧进度
    try {
      var data = await Z.api("plugins/course-grab/logs?limit=300");
      var evs = data.events || [];
      var start = -1;
      for (var i = evs.length - 1; i >= 0; i--) {
        if (evs[i].type === "plugin_status" && evs[i].status === "running") { start = i; break; }
      }
      if (start < 0) return null;
      var last = null;
      for (var j = start + 1; j < evs.length; j++) {
        if (evs[j].type === "progress") last = evs[j];
      }
      return last;
    } catch (e) {
      return null;
    }
  }

  async function grabState() {
    // 查询插件进程状态与最近一次进度; 查询失败时保守视为仍在运行(避免误判完成)
    try {
      var data = await Z.api("plugins");
      var p = (data.plugins || []).find(function (x) { return x.id === "course-grab"; });
      var st = {
        running: !!(p && p.running),
        progress: (p && p.progress) || null,
      };
      if (st.running && !st.progress) st.progress = await progressFromEvents();
      return st;
    } catch (e) {
      return { running: true, progress: null };
    }
  }

  function fmtEta(s) {
    s = Math.max(0, Math.round(Number(s) || 0));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h > 0) return h + " 小时 " + m + " 分";
    if (m > 0) return m + " 分 " + sec + " 秒";
    return sec + " 秒";
  }

  // ---------------- 专业课程抓取: 选好专业点按钮触发, 失败可检测可重试 ----------------

  var coursesTimer = null;   // 课程抓取监控轮询句柄
  var courseCacheRequest = 0; // 丢弃切换专业后迟到的旧缓存响应

  function stopCoursesWatch() {
    if (coursesTimer) { clearInterval(coursesTimer); coursesTimer = null; }
    coursesRunning = false;
    syncLoadBtn();
  }

  function renderCoursesProgress(prog) {
    var row = $("cg-courses-progress");
    if (!row || !prog || !(Number(prog.total) > 0)) return;
    var done = Number(prog.done) || 0, total = Number(prog.total);
    var pct = Math.min(100, Math.round(done / total * 100));
    $("cg-courses-bar").style.width = pct + "%";
    var txt = "已读取 " + done + "/" + total + " 页(" + pct + "%)";
    if (prog.eta_seconds != null) txt += " · 预计剩余 " + fmtEta(prog.eta_seconds);
    $("cg-courses-progress-text").textContent = txt;
    row.hidden = false;
  }

  function hideCoursesProgress() {
    var row = $("cg-courses-progress");
    if (!row) return;
    row.hidden = true;
    $("cg-courses-bar").style.width = "0%";
  }

  function watchCoursesGrab() {
    stopCoursesWatch();
    var btn = $("cg-load");
    var started = Date.now();
    var everRunning = false;
    coursesRunning = true;
    btn.disabled = true;
    coursesTimer = setInterval(async function () {
      // 配置界面已切换/卸载时停止监控
      if (!document.getElementById("cg-load")) { stopCoursesWatch(); return; }
      try {
        var st = await grabState();
        if (st.running) everRunning = true;
        if (st.running) {
          // 运行中: 渲染进度条(翻页开始前显示已用时间)
          renderCoursesProgress(st.progress);
          if (!(st.progress && Number(st.progress.total) > 0)) {
            var pt = $("cg-courses-progress-text");
            if (pt) pt.textContent = "抓取中…已用 "
              + Math.round((Date.now() - started) / 1000) + " 秒";
          }
        } else {
          var cached = await fetchCourses();
          if (cached === null) return;   // 选择已变化, 等下一轮重新判断
          if (cached) {
            // 任务结束且课程缓存就绪 → 成功, 自动列出课程
            stopCoursesWatch();
            btn.disabled = false;
            hideCoursesProgress();
            Z.message("success", "专业课程抓取完成,已在下方列出,请勾选要抢的课程");
          } else if (everRunning || Date.now() - started > 8000) {
            // 抓取进程已结束但缓存未生成 → 失败, 允许重试
            stopCoursesWatch();
            btn.disabled = false;
            hideCoursesProgress();
            var empty = $("cg-courses-empty");
            empty.hidden = false;
            empty.className = "crowkit-alert crowkit-error";
            empty.textContent = "抓取已结束但课程缓存未生成，可切换到“运行”页检查流程状态后点击「开始专业课程抓取」重试";
            Z.message("error", "专业课程抓取失败，请检查运行状态后重试");
          } else if (st.progress && st.progress.stage
              && st.progress.stage !== "courses") {
            // 占用进程槽位的是其他任务(如目录抓取/抢课), 不属于课程抓取监控范围
            stopCoursesWatch();
            btn.disabled = false;
            hideCoursesProgress();
          } else if (Date.now() - started > 30 * 60 * 1000) {
            stopCoursesWatch();
            btn.disabled = false;
            hideCoursesProgress();
          }
        }
      } catch (e) {
        // 单轮查询失败(网络抖动等)忽略, 下一轮再试
      }
    }, 3000);
  }

  async function onGrabCoursesClick() {
    var btn = $("cg-load");
    var sp = specialtyNow();
    if (!(sp.level.v && sp.grade.v && sp.dept.v && sp.major.v)) {
      Z.message("warning", "请先选择完整的培养层次/年级/院(系)/部与专业");
      return;
    }
    if (!(await save(true))) return;
    btn.disabled = true;
    // 立即展示进度条(0% 启动态); 判空防御同目录抓取(旧版 DOM 可能缺元素)
    var row = $("cg-courses-progress");
    if (row) {
      row.hidden = false;
      $("cg-courses-bar").style.width = "0%";
      $("cg-courses-progress-text").textContent = "正在启动抓取…";
    }
    try {
      try {
        await Z.post("plugins/course-grab/major-courses/refresh", { specialty: sp });
      } catch (e) {
        // 任务已在运行(如重复点击/其他抓取占用)时转为监控进度
        if (String(e.message || "").indexOf("已在运行") < 0) throw e;
        Z.message("info", "检测到抓取任务已在运行,正在监控进度…");
      }
      if (typeof Z.showRun === "function") Z.showRun();
      watchCoursesGrab();
    } catch (e) {
      btn.disabled = false;
      hideCoursesProgress();
      Z.message("error", e.message);
    }
  }

  // ---------------- 初始化 ----------------
  (async function init() {
    var cfg = await Z.getConfig();
    $("cg-poll").value = cfg.poll_interval != null
      ? Math.min(60, Math.max(2, Number(cfg.poll_interval) || 3)) : 3;
    $("cg-headless").checked = cfg.headless !== false;
    selectedOrder = [];
    if (Array.isArray(cfg.course_order)) {
      cfg.course_order.forEach(function (item) {
        if (!item || typeof item !== "object") return;
        addSelected(
          String(item.code || "").trim().toUpperCase(),
          String(item.class_num || "").trim(),
          !!item.grouped || !item.class_num
        );
      });
    }
    Object.keys(cfg.courses || {}).forEach(function (code) {
      var cl = cfg.courses[code];
      var classNums = Array.isArray(cl)
        ? cl.map(function (value) { return String(value).trim(); }).filter(Boolean)
        : String(cl || "").split(/[,，\s]+/).filter(Boolean);
      if (classNums.length) {
        classNums.forEach(function (classNum) {
          addSelected(String(code || "").trim().toUpperCase(), classNum);
        });
      } else if (!selectedOrder.some(function (item) {
        return item.code === String(code || "").trim().toUpperCase();
      })) {
        addSelected(String(code || "").trim().toUpperCase(), "");
      }
    });
    savedSp = cfg.specialty || null;
    // 回显已保存专业: 兼容 {v,t} 对象与旧版纯字符串两种形态
    function spVal(x) {
      return x && typeof x === "object" ? String(x.v || "") : String(x || "");
    }
    var sel = savedSp && (savedSp.level || savedSp.major) ? {
      level: spVal(savedSp.level), grade: spVal(savedSp.grade),
      dept: spVal(savedSp.dept), major: spVal(savedSp.major),
    } : null;
    var ok = await loadCatalog(sel);
    if (!ok) $("cg-load").disabled = true;
    await applySelectedAccountSpecialty();

    var st = await grabState();

    // 打开页面时课程抓取已在运行(刷新/重进等): 接管进度监控
    if (st.running && st.progress && st.progress.stage === "courses") {
      Z.message("info", "检测到专业课程抓取任务正在运行,已接管进度监控");
      watchCoursesGrab();
    }

    // 回显已保存专业后自动加载其课程缓存(如有)
    maybeAutoLoad();
    renderSelectedCourses();

    ["cg-level", "cg-grade", "cg-dept", "cg-major"].forEach(function (id) {
      // input 与 change 双保险: 某些浏览器/自动化流程可能只触发其中之一
      $(id).addEventListener("input", syncLoadBtn);
    });
    $("cg-level").addEventListener("change", function () {
      fillSelect($("cg-grade"), nodeAt([$("cg-level").value]));
      fillSelect($("cg-dept"), null);
      fillSelect($("cg-major"), null);
      syncLoadBtn();
    });
    $("cg-grade").addEventListener("change", function () {
      fillSelect($("cg-dept"), nodeAt([$("cg-level").value, $("cg-grade").value]));
      fillSelect($("cg-major"), null);
      syncLoadBtn();
    });
    $("cg-dept").addEventListener("change", function () {
      fillSelect($("cg-major"), nodeAt([$("cg-level").value, $("cg-grade").value, $("cg-dept").value]));
      syncLoadBtn();
    });
    $("cg-major").addEventListener("change", function () {
      // 选专业是四级联动最后一步: 此前 syncLoadBtn 只在上级 change 时调用,
      // 手动从头选择时按钮会一直是禁用态, 这里必须同步一次
      syncLoadBtn();
      maybeAutoLoad();
    });
    $("cg-load").addEventListener("click", onGrabCoursesClick);
    $("cg-filter").addEventListener("input", function () { renderCourses(true); });
    $("cg-category-filter").addEventListener("change", function () {
      renderCourses(true);
    });
    $("cg-time-toggle").addEventListener("click", function () {
      var panel = $("cg-time-panel");
      panel.hidden = !panel.hidden;
      $("cg-time-toggle").textContent = panel.hidden ? "按时间筛选" : "收起时间表";
    });
    $("cg-filter-reset").addEventListener("click", function () {
      $("cg-filter").value = "";
      $("cg-category-filter").value = "";
      selectedTimes = {};
      renderTimeGrid();
      renderCourses(true);
    });
    $("cg-page-first").addEventListener("click", function () {
      coursePage = 1;
      renderCourses();
    });
    $("cg-page-prev").addEventListener("click", function () {
      if (coursePage > 1) {
        coursePage -= 1;
        renderCourses();
      }
    });
    $("cg-page-next").addEventListener("click", function () {
      coursePage += 1;
      renderCourses();
    });
    var accountChangedHandler = async function (event) {
      if (!event.detail || event.detail.pluginId !== "course-grab") return;
      await applySelectedAccountSpecialty();
    };
    if (window.__courseGrabAccountChangedHandler) {
      window.removeEventListener(
        "crowkit-account-changed",
        window.__courseGrabAccountChangedHandler
      );
    }
    window.__courseGrabAccountChangedHandler = accountChangedHandler;
    window.addEventListener("crowkit-account-changed", accountChangedHandler);
    window.BnuToolBoxPluginSave = function () {
      return save(true);
    };
    window.addEventListener("beforeunload", function () {
      window.removeEventListener(
        "crowkit-account-changed", accountChangedHandler);
      if (window.__courseGrabAccountChangedHandler === accountChangedHandler) {
        delete window.__courseGrabAccountChangedHandler;
      }
      delete window.BnuToolBoxPluginSave;
    });
  })().catch(function (e) {
    Z.message("error", "配置界面初始化失败: " + e.message);
  });
})();
</script>
